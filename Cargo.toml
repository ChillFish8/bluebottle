[workspace]
resolver = "3"
members = [
    "bluebottle",
    "bluebottle-ui", "bluebottle-video", "bluebottle-window",
    "placebo-sys",
]

[workspace.dependencies]
palette = "0.7"
lyon_algorithms = "1"
foldhash = "0.2"
phf = "0.13"
phf_codegen = "0.13"
humantime = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
serde = "1"
serde_derive = "1"
serde_json = "1"
rmp-serde = "1"
snafu = "0.8"
blake3 = "1"
directories = "6"
parking_lot = "0.12"
lru = "0.16"
arrayvec = "0.7"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# 3rd party widgets
iced_palace = "0.14"

uuid = { version = "1", features = ["v7"] }
url = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["net", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "rustls-tls", "rustls-tls-native-roots", "json", "zstd"] }
iced = { version = "0.14", default-features = false, features = ["crisp", "wayland", "x11", "wgpu", "advanced", "tokio", "image", "svg", "canvas", "sipper"] }
rusqlite = { version = "0.38", features = ["bundled", "serde_json", "uuid"] }

# Low-level iced crates used to drive the renderer manually for the overlay window.
iced_core = "0.14"
iced_futures = "0.14"
iced_graphics = "0.14"
iced_program = "0.14"
iced_runtime = "0.14"

# Windowing for the overlay subsurface (Wayland only, for now).
raw-window-handle = "0.6"
smithay-client-toolkit = "0.20"
pollster = "0.4"

# Cross-platform clipboard access (uses smithay-clipboard on Wayland).
window_clipboard = "0.5"

# Used by examples to render the caller-owned main surface.
wgpu = "27"

# GStreamer playback. Used by the `gst` example (waylandsink) and by
# `bluebottle-video` (the `placebosink` libplacebo renderer + Player).
gstreamer = "0.25"
# v1_24 enables the DMA-DRM video-info API (`VideoInfoDmaDrm`) used for
# zero-copy dmabuf import; the system GStreamer is 1.28.
gstreamer-video = { version = "0.25", features = ["v1_24"] }
gstreamer-base = "0.25"
gstreamer-allocators = "0.25"
gstreamer-gl = "0.25"

# Raw Vulkan, used by `bluebottle-video` to build the `VkSurfaceKHR` that
# libplacebo's swapchain presents onto the bluebottle-window content surface.
ash = "0.38"

# FFI tooling for the in-tree `placebo-sys` libplacebo bindings.
bindgen = "0.72"
pkg-config = "0.3"

# Dev dependencies
rstest = "0.26"
